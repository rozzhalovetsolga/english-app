<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Practice</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f7f6f2;
  --card: #ffffff;
  --text: #1f2328;
  --muted: #6a6f76;
  --line: #e2e0d8;
  --accent: #2f5d8a;
  --accent-soft: #e6eef6;
  --ok: #2e7d4f;
  --ok-soft: #e4f3ea;
  --bad: #b23b3b;
  --bad-soft: #f8e6e6;
  --note: #8a6a1f;
  --note-soft: #faf2dc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181b;
    --card: #1f2226;
    --text: #e6e6e3;
    --muted: #9aa0a6;
    --line: #33373d;
    --accent: #7fb0e0;
    --accent-soft: #23303d;
    --ok: #6cc595;
    --ok-soft: #1f3328;
    --bad: #e57b7b;
    --bad-soft: #3a2224;
    --note: #e0c070;
    --note-soft: #332c1a;
  }
}
:root[data-theme="dark"] {
  --bg: #16181b;
  --card: #1f2226;
  --text: #e6e6e3;
  --muted: #9aa0a6;
  --line: #33373d;
  --accent: #7fb0e0;
  --accent-soft: #23303d;
  --ok: #6cc595;
  --ok-soft: #1f3328;
  --bad: #e57b7b;
  --bad-soft: #3a2224;
  --note: #e0c070;
  --note-soft: #332c1a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, button, input {
  font: inherit;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
}
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0; }
.tabs button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
}
.prompt { font-size: 22px; font-weight: 600; margin: 4px 0 12px; }
.hint { color: var(--muted); font-size: 14px; }
.progress { color: var(--muted); font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; }
input.answer { width: 100%; font-size: 18px; padding: 10px 12px; margin-bottom: 10px; }
.feedback { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; }
.feedback.ok { display: block; background: var(--ok-soft); color: var(--ok); }
.feedback.bad { display: block; background: var(--bad-soft); color: var(--bad); }
.feedback .full { color: var(--text); margin-top: 4px; }
.note { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--note-soft); color: var(--note); font-size: 14px; }
.options { display: grid; gap: 8px; }
.options button { text-align: left; padding: 12px; }
.options button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.options button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.flip { min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; user-select: none; }
.flip .side { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.flip .big { font-size: 24px; font-weight: 600; }
.flip .ex { color: var(--muted); margin-top: 8px; font-style: italic; }
.actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td .n { color: var(--note); font-size: 13px; margin-top: 2px; }
.hidden-en td.en span, .hidden-en td.en .tr { filter: blur(6px); cursor: pointer; }
.hidden-en td.en.shown span, .hidden-en td.en.shown .tr { filter: none; }
.done { text-align: center; }
.done .score { font-size: 32px; font-weight: 700; margin: 8px 0; }
.tr { color: var(--muted); font-size: 15px; margin: -6px 0 12px; }
.feedback .tr { margin: 2px 0 0; }
td .tr { margin: 2px 0 0; font-size: 13px; }
button.say { padding: 2px 10px; font-size: 13px; margin-left: 6px; vertical-align: middle; }
.tabs .sep { flex-basis: 100%; height: 0; }
.tabs .label { color: var(--muted); font-size: 13px; align-self: center; margin-right: 2px; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.pairs .col { display: grid; gap: 8px; align-content: start; }
.tile { text-align: left; padding: 10px; min-height: 48px; font-size: 15px; transition: background .15s; }
.tile.sel { background: var(--accent-soft); border-color: var(--accent); }
.tile.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); opacity: .7; }
.tile.wrong { background: var(--bad-soft); border-color: var(--bad); }
.slots { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 14px; min-height: 40px; }
.slot { width: 30px; height: 38px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; }
.gap { width: 14px; }
.letters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.letter { width: 40px; height: 44px; padding: 0; font-size: 20px; font-weight: 600; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.blitz-ru { text-align: center; font-size: 20px; margin: 4px 0 18px; color: var(--accent); }
.blitz-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.blitz-buttons button { padding: 16px; font-size: 18px; }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>English Practice</h1>
  <div class="sub">Слова и конструкции с уроков. Транскрипция британская. Кнопка «Слушать» произносит слово голосом браузера. Ошибки запоминаются в этом браузере, их можно повторить отдельно.</div>

  <div class="row">
    <label for="lesson">Урок:</label>
    <select id="lesson"></select>
    <label><input type="checkbox" id="onlyMistakes"> только ошибки <span id="mistakeCount" class="badge"></span></label>
  </div>

  <div class="tabs" id="tabs">
    <button data-mode="type" class="active">RU → EN (писать)</button>
    <button data-mode="choice">EN → RU (выбор)</button>
    <button data-mode="cloze">Вставь слово</button>
    <button data-mode="cards">Карточки</button>
    <button data-mode="list">Список</button>
    <span class="sep"></span>
    <span class="label">Игры:</span>
    <button data-mode="pairs">Пары</button>
    <button data-mode="scramble">Собери слово</button>
    <button data-mode="blitz">Блиц 60 с</button>
    <button data-mode="listen">На слух</button>
  </div>

  <div id="app"></div>
</div>

<script>
// Чтобы добавить новый урок, допишите объект в LESSONS.
// en — допустимые ответы (первый показывается как основной), tr — транскрипция, note — пояснение или исправление.
const LESSONS = [
  {
    id: "2026-10-19",
    title: "Урок 19.10.2026",
    words: [
      { en: ["evenly", "uniformly"], tr: "/ˈiːvənli / ˈjuːnɪfɔːmli/", ru: "равномерно, однородно", ex: "Spread the paint evenly." },
      { en: ["uniformity"], tr: "/ˌjuːnɪˈfɔːməti/", ru: "однородность", ex: "The uniformity of the results surprised us." },
      { en: ["meticulous", "scrupulous"], tr: "/məˈtɪkjələs / ˈskruːpjələs/", ru: "тщательный, кропотливый, скрупулёзный", ex: "She is meticulous about details.", note: "Произношение: ударение на второй слог — /məˈtɪkjələs/, «мэТИкьюлэс»." },
      { en: ["to quit", "quit"], tr: "/kwɪt/", ru: "бросить, прекратить что-то делать", ex: "I quit smoking last year.", note: "Неправильный глагол: quit – quit – quit. Правильно «I quit smoking», не «I quited»." },
      { en: ["organised and structured", "organized and structured"], tr: "/ˈɔːɡənaɪzd ənd ˈstrʌktʃəd/", ru: "организованный и структурированный", ex: "My thoughts were organised and structured.", note: "organised — британское написание, organized — американское. Оба верны." },
      { en: ["at that time", "during that time"], tr: "/ət ˈðæt ˈtaɪm / ˈdjʊərɪŋ ˈðæt ˈtaɪm/", ru: "в то время", ex: "At that time I lived in Minsk.", note: "Либо at that time, либо during that time. Вместе during и at не ставятся." },
      { en: ["mandala drawings", "drawings of mandalas", "mandalas"], tr: "/ˈmændələ ˈdrɔːɪŋz/", ru: "рисунки мандал, мандалы", ex: "I like drawing mandalas." },
      { en: ["eloquent"], tr: "/ˈeləkwənt/", ru: "красноречивый", ex: "He gave an eloquent speech." },
      { en: ["distort", "twist", "mess up"], tr: "/dɪˈstɔːt / twɪst / ˌmes ˈʌp/", ru: "искажать, портить", ex: "Don't twist my words.", note: "distort / twist — исказить смысл, слова, факты. mess up — испортить, напортачить (разговорное)." },
      { en: ["translated books"], tr: "/trænzˈleɪtɪd ˈbʊks/", ru: "переведённые книги", ex: "I mostly read translated books.", note: "translatED books — переведённые книги. translate books — глагол «переводить книги»." },
      { en: ["to form an opinion", "form an opinion"], tr: "/fɔːm ən əˈpɪnjən/", ru: "сформировать мнение", ex: "I need time to form an opinion." },
      { en: ["novels", "novel"], tr: "/ˈnɒvəlz/", ru: "романы", ex: "I read novels in the evening.", note: "novel — роман вообще. romance (romance novel) — именно любовный роман." },
      { en: ["fiction"], tr: "/ˈfɪkʃən/", ru: "художественная литература", ex: "I prefer fiction to non-fiction." },
      { en: ["non-fiction", "nonfiction"], tr: "/ˌnɒnˈfɪkʃən/", ru: "нехудожественная литература (научно-популярная, документальная)", ex: "Non-fiction helps me learn new things.", note: "non-fiction шире, чем «научпоп»: сюда входят биографии, мемуары, книги по бизнесу. Научно-популярная — popular science." },
      { en: ["explicitly"], tr: "/ɪkˈsplɪsɪtli/", ru: "явно, чётко, недвусмысленно", ex: "He explicitly said no." },
      { en: ["different types of relationships"], tr: "/ˈdɪfrənt ˈtaɪps əv rɪˈleɪʃənʃɪps/", ru: "разные виды отношений", ex: "The book describes different types of relationships." },
      { en: ["productivity"], tr: "/ˌprɒdʌkˈtɪvəti/", ru: "продуктивность", ex: "Sleep affects my productivity." },
      { en: ["people around you", "surrounding people"], tr: "/ˈpiːpəl əˈraʊnd juː/", ru: "окружающие тебя люди, люди вокруг", ex: "The people around you shape your habits.", note: "people around you звучит естественнее, чем surrounding people." },
      { en: ["educated"], tr: "/ˈedʒukeɪtɪd/", ru: "образованный", ex: "She is a well-educated woman.", note: "educated — это про образование. «Воспитанный» — well-mannered или polite." },
      { en: ["it's not that", "it is not that"], tr: "/ɪts ˈnɒt ðæt/", ru: "дело не в том, что", ex: "It's not that I don't like it, I'm just tired.", note: "Не забывайте связку that. Без неё предложение рассыпается на набор слов." },
      { en: ["psychiatric hospital", "asylum"], tr: "/ˌsaɪkiˈætrɪk ˈhɒspɪtəl / əˈsaɪləm/", ru: "психиатрическая больница", ex: "He worked in a psychiatric hospital.", note: "asylum — устаревшее слово и может звучать грубо. Нейтрально: psychiatric hospital. Произношение: asylum — /əˈsaɪləm/, «эсАйлэм»; psychiatric начинается с /saɪ/, p не читается." },
      { en: ["to know one's limits", "know one's limits", "to know your limits", "know your limits"], tr: "/nəʊ wʌnz ˈlɪmɪts/", ru: "знать свои пределы", ex: "You should know your limits." },
      { en: ["boundary", "boundaries"], tr: "/ˈbaʊndəri/", ru: "граница (в том числе личная)", ex: "It's important to set boundaries." },
      { en: ["to know when to stop", "know when to stop"], tr: "/nəʊ ˈwen tə ˈstɒp/", ru: "знать, когда остановиться", ex: "The key is to know when to stop." },
      { en: ["to achieve a goal", "achieve a goal"], tr: "/əˈtʃiːv ə ˈɡəʊl/", ru: "достичь цели", ex: "She achieved her goal in a year." },
      { en: ["to break", "break"], tr: "/breɪk – brəʊk – ˈbrəʊkən/", ru: "ломать", ex: "Be careful, don't break it.", note: "Неправильный глагол: break – broke – broken. «to broke» не бывает: broke — прошедшее время, broken — «сломанный»." },
      { en: ["broken"], tr: "/ˈbrəʊkən/", ru: "сломанный", ex: "My phone is broken." },
      { en: ["consist of"], tr: "/kənˈsɪst əv/", ru: "состоять из", ex: "The team consists of five people.", note: "Всегда с of: consists of, не consists from." },
      { en: ["another"], tr: "/əˈnʌðə/", ru: "другой, ещё один", ex: "I want to find another hobby.", note: "После another — существительное в единственном числе: another hobby, another reason." },
      { en: ["new people"], tr: "/njuː ˈpiːpəl/", ru: "новые люди", ex: "I like meeting new people.", note: "people уже множественное число. «Peoples» в значении «люди» не говорят." }
    ],
    cloze: [
      { q: "I ___ smoking two years ago.", a: ["quit"], ru: "Я бросила курить два года назад.", note: "quit – quit – quit, без -ed." },
      { q: "___ that time I lived with my parents.", a: ["at", "during"], ru: "В то время я жила с родителями.", note: "Одно из двух: at или during." },
      { q: "I mostly read ___ books.", a: ["translated"], ru: "Я в основном читаю переведённые книги." },
      { q: "It's not ___ I don't want to go, I'm just tired.", a: ["that"], ru: "Дело не в том, что я не хочу идти, я просто устала." },
      { q: "I dropped my phone and it ___.", a: ["broke"], ru: "Я уронила телефон, и он сломался.", note: "break – broke – broken." },
      { q: "My laptop is ___, I can't work.", a: ["broken"], ru: "Мой ноутбук сломан, я не могу работать." },
      { q: "The course consists ___ ten lessons.", a: ["of"], ru: "Курс состоит из десяти уроков." },
      { q: "I want to find ___ hobby.", a: ["another"], ru: "Я хочу найти ещё одно хобби." },
      { q: "At the conference I met a lot of new ___.", a: ["people"], ru: "На конференции я познакомилась со многими новыми людьми." },
      { q: "Spread the cream ___ over the cake.", a: ["evenly", "uniformly"], ru: "Распределите крем равномерно по торту." },
      { q: "He ___ my words, and everyone misunderstood me.", a: ["twisted", "distorted"], ru: "Он исказил мои слова, и все меня неправильно поняли." },
      { q: "You need to know your ___.", a: ["limits"], ru: "Нужно знать свои пределы." },
      { q: "She is very ___: she checks every single detail.", a: ["meticulous", "scrupulous"], ru: "Она очень тщательная: проверяет каждую мелочь." },
      { q: "It's important to set personal ___.", a: ["boundaries"], ru: "Важно устанавливать личные границы." },
      { q: "I'd like to ___ an opinion before I decide.", a: ["form"], ru: "Я хочу сформировать мнение, прежде чем решать." },
      { q: "It took her a year to ___ her goal.", a: ["achieve"], ru: "Ей понадобился год, чтобы достичь цели." },
      { q: "The rules say it ___: no phones in class.", a: ["explicitly"], ru: "В правилах прямо сказано: никаких телефонов на уроке." },
      { q: "His speech was so ___ that everyone listened.", a: ["eloquent"], ru: "Его речь была такой красноречивой, что все слушали." },
      { q: "I prefer ___ — biographies and books about business.", a: ["non-fiction", "nonfiction"], ru: "Я предпочитаю нехудожественную литературу — биографии и книги о бизнесе." },
      { q: "Good sleep improves my ___.", a: ["productivity"], ru: "Хороший сон повышает мою продуктивность." }
    ]
  },
  {
    id: "ielts-hobbies",
    title: "IELTS: Hobbies",
    words: [
      { en: ["rewarding hobby"], tr: "/rɪˈwɔːdɪŋ ˈhɒbi/", ru: "хобби, которое приносит удовлетворение", ex: "Gardening is a rewarding hobby: you see the results of your work." },
      { en: ["skill-based hobby"], tr: "/ˈskɪl beɪst ˈhɒbi/", ru: "хобби, которое развивает навык или талант", ex: "Playing the guitar is a skill-based hobby." },
      { en: ["time-filler"], tr: "/ˈtaɪm ˌfɪlə/", ru: "занятие, чтобы скоротать время", ex: "Mobile games are just a time-filler for me." },
      { en: ["to kill time", "kill time"], tr: "/ˌkɪl ˈtaɪm/", ru: "убить время, скоротать время", ex: "I read on the train to kill time.", note: "time-filler — существительное (занятие). to kill time — глагольное выражение. Это два разных выражения, не одно." },
      { en: ["lifelong passion"], tr: "/ˈlaɪflɒŋ ˈpæʃən/", ru: "увлечение на всю жизнь", ex: "Drawing has been my lifelong passion." },
      { en: ["outdoor activities"], tr: "/ˈaʊtdɔːr ækˈtɪvətiz/", ru: "занятия на улице (поход, велосипед)", ex: "I prefer outdoor activities like hiking and cycling." },
      { en: ["indoor activities"], tr: "/ˈɪndɔːr ækˈtɪvətiz/", ru: "занятия в помещении (игры, чтение)", ex: "In winter I switch to indoor activities like reading." },
      { en: ["to wind down", "wind down"], tr: "/ˌwaɪnd ˈdaʊn/", ru: "расслабиться после работы или стресса", ex: "I draw mandalas to wind down after work.", note: "wind здесь читается [waɪnd], как в «wind a clock», а не [wɪnd] (ветер). Прошедшее время: wound down [waʊnd]." },
      { en: ["to take up a hobby", "take up a hobby"], tr: "/ˌteɪk ˈʌp ə ˈhɒbi/", ru: "начать новое хобби, заняться чем-то", ex: "Last year I took up yoga.", note: "take up — начать заниматься. Противоположное — give up или quit (бросить)." },
      { en: ["an escape from daily routine", "escape from daily routine", "an escape from routine", "escape from routine"], tr: "/ən ɪˈskeɪp frəm ˈdeɪli ruːˈtiːn/", ru: "побег от рутины", ex: "Reading is an escape from daily routine for me.", note: "Произношение: routine — ударение на второй слог, /ruːˈtiːn/, «руТИН»." },
      { en: ["to add variety", "add variety"], tr: "/æd vəˈraɪəti/", ru: "добавить разнообразия", ex: "Hobbies add variety to my life." },
      { en: ["creative"], tr: "/kriˈeɪtɪv/", ru: "творческий", ex: "Drawing is a creative hobby." },
      { en: ["relaxing"], tr: "/rɪˈlæksɪŋ/", ru: "расслабляющий", ex: "Yoga is very relaxing." },
      { en: ["fascinating"], tr: "/ˈfæsɪneɪtɪŋ/", ru: "увлекательный, захватывающий", ex: "I find history fascinating." },
      { en: ["intellectual"], tr: "/ˌɪntəˈlektʃuəl/", ru: "интеллектуальный", ex: "Chess is an intellectual game.", note: "Произношение: главное ударение на «лек» — /ˌɪntəˈlektʃuəl/." },

const STORE_KEY = "english-practice-mistakes";
const LESSON_KEY = "english-practice-lesson";

// Внутри Telegram: тема из Telegram, ошибки дублируются в облако Telegram (до 4 КБ на ключ).
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
}

function loadMistakes() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveMistakes(mistakes) {
  const json = JSON.stringify(mistakes);
  try { localStorage.setItem(STORE_KEY, json); } catch (e) {}
  if (tg && tg.CloudStorage && json.length < 4000) {
    try { tg.CloudStorage.setItem(STORE_KEY, json); } catch (e) {}
  }
}

let mistakes = loadMistakes();
let mode = "type";
let lessonId = LESSONS[LESSONS.length - 1].id;
try { lessonId = localStorage.getItem(LESSON_KEY) || lessonId; } catch (e) {}
if (!LESSONS.some(lesson => lesson.id === lessonId)) lessonId = LESSONS[LESSONS.length - 1].id;

const app = document.getElementById("app");
const lessonSelect = document.getElementById("lesson");
const onlyMistakesBox = document.getElementById("onlyMistakes");

for (const lesson of LESSONS) {
  const option = document.createElement("option");
  option.value = lesson.id;
  option.textContent = lesson.title;
  lessonSelect.appendChild(option);
}
lessonSelect.value = lessonId;

function currentLesson() {
  return LESSONS.find(lesson => lesson.id === lessonId);
}
function wordKey(word) { return lessonId + "|w|" + word.en[0]; }
function clozeKey(item) { return lessonId + "|c|" + item.q; }

function markMistake(key, wasWrong) {
  if (wasWrong) mistakes[key] = (mistakes[key] || 0) + 1;
  else delete mistakes[key];
  saveMistakes(mistakes);
  updateMistakeCount();
}

function updateMistakeCount() {
  const count = Object.keys(mistakes).filter(key => key.startsWith(lessonId + "|")).length;
  document.getElementById("mistakeCount").textContent = count ? count : "";
}

function normalize(text) {
  return text.toLowerCase()
    .replace(/[’`]/g, "'")
    .replace(/[.!?,;:]+$/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/^to /, "");
}
function isCorrect(input, answers) {
  const given = normalize(input);
  return given.length > 0 && answers.some(answer => normalize(answer) === given);
}

function shuffle(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

const sayVoices = { voice: null };
function pickVoice() {
  try {
    const voices = speechSynthesis.getVoices();
    sayVoices.voice = voices.find(voice => voice.lang === "en-GB") || voices.find(voice => voice.lang.startsWith("en")) || null;
  } catch (e) {}
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
// Готовые аудиофайлы (нейроголос) лежат рядом со страницей; если файла нет — голос браузера.
let AUDIO = {};
fetch("audio/index.json").then(response => response.ok ? response.json() : {}).then(map => { AUDIO = map; }).catch(() => {});
let currentAudio = null;
function speak(text) {
  const file = AUDIO[text];
  if (file) {
    if (currentAudio) currentAudio.pause();
    currentAudio = new Audio("audio/" + file);
    currentAudio.play().catch(() => speakSynth(text));
    return;
  }
  speakSynth(text);
}
function speakSynth(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-GB";
  utterance.rate = 0.9;
  if (sayVoices.voice) utterance.voice = sayVoices.voice;
  speechSynthesis.speak(utterance);
}
function sayButton(text) {
  return `<button class="say" data-say="${escapeHtml(text)}">Слушать</button>`;
}
function trLine(word) {
  return `<div class="tr">${escapeHtml(word.tr || "")}${sayButton(word.en[0].replace(/^to /, ""))}</div>`;
}
document.addEventListener("click", event => {
  const button = event.target.closest("button.say");
  if (!button) return;
  event.stopPropagation();
  speak(button.dataset.say);
}, true);

function pool(kind) {
  const lesson = currentLesson();
  const items = kind === "cloze" ? lesson.cloze : lesson.words;
  if (!onlyMistakesBox.checked) return items;
  const keyOf = kind === "cloze" ? clozeKey : wordKey;
  return items.filter(item => mistakes[keyOf(item)]);
}

function emptyMistakes() {
  app.innerHTML = '<div class="card done"><p>Ошибок в этом уроке нет.</p><p class="hint">Снимите галочку «только ошибки», чтобы тренировать все слова.</p></div>';
}

function renderDone(right, total, restart, extra) {
  const percent = total ? Math.round(right / total * 100) : 0;
  app.innerHTML = `<div class="card done">
    <div class="hint">Готово</div>
    <div class="score">${right} / ${total}</div>
    <div class="hint">${percent}% верно</div>
    ${extra ? `<div class="hint">${escapeHtml(extra)}</div>` : ""}
    <div class="actions" style="justify-content:center">
      <button class="primary" id="again">Ещё раз</button>
    </div>
  </div>`;
  document.getElementById("again").onclick = restart;
}

function startType() {
  const items = shuffle(pool("words"));
  if (!items.length) return emptyMistakes();
  let index = 0;
  let right = 0;

  function show() {
    if (index >= items.length) return renderDone(right, items.length, startType);
    const word = items[index];
    app.innerHTML = `<div class="card">
      <div class="progress"><span>${index + 1} / ${items.length}</span><span>верно: ${right}</span></div>
      <div class="hint">Переведите на английский</div>
      <div class="prompt">${escapeHtml(word.ru)}</div>
      <input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="по-английски">
      <div class="row">
        <button class="primary" id="check">Проверить</button>
        <button id="hintBtn">Первая буква</button>
        <button id="skip">Не знаю</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>`;
    const input = document.getElementById("answer");
    const feedback = document.getElementById("feedback");
    let answered = false;
    input.focus();

    function finish(wasRight) {
      answered = true;
      if (wasRight) right++;
      markMistake(wordKey(word), !wasRight);
      feedback.className = "feedback " + (wasRight ? "ok" : "bad");
      feedback.innerHTML = `<div>${wasRight ? "Верно" : "Правильно:"} <b>${escapeHtml(word.en.join(" / "))}</b></div>
        ${trLine(word)}
        <div class="full">${escapeHtml(word.ex)}${sayButton(word.ex)}</div>
        ${word.note ? `<div class="note">${escapeHtml(word.note)}</div>` : ""}`;
      const checkButton = document.getElementById("check");
      checkButton.textContent = "Дальше";
      document.getElementById("hintBtn").disabled = true;
      document.getElementById("skip").disabled = true;
      checkButton.focus();
    }
    function next() { index++; show(); }

    document.getElementById("check").onclick = () => answered ? next() : finish(isCorrect(input.value, word.en));
    document.getElementById("skip").onclick = () => finish(false);
    document.getElementById("hintBtn").onclick = () => { input.placeholder = word.en[0].replace(/^to /, "")[0] + "…"; input.focus(); };
    input.onkeydown = event => { if (event.key === "Enter") document.getElementById("check").click(); };
  }
  show();
}

function startChoice() {
  const items = shuffle(pool("words"));
  if (!items.length) return emptyMistakes();
  const allWords = currentLesson().words;
  let index = 0;
  let right = 0;

  function show() {
    if (index >= items.length) return renderDone(right, items.length, startChoice);
    const word = items[index];
    const distractors = shuffle(allWords.filter(other => other !== word)).slice(0, 3);
    const options = shuffle([word, ...distractors]);
    app.innerHTML = `<div class="card">
      <div class="progress"><span>${index + 1} / ${items.length}</span><span>верно: ${right}</span></div>
      <div class="hint">Что это значит?</div>
      <div class="prompt">${escapeHtml(word.en.join(" / "))}</div>
      ${trLine(word)}
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions"><button class="primary" id="next" style="display:none">Дальше</button></div>
    </div>`;
    const box = document.getElementById("options");
    const buttons = [];
    for (const option of options) {
      const button = document.createElement("button");
      button.textContent = option.ru;
      button.onclick = () => {
        const wasRight = option === word;
        if (wasRight) right++;
        markMistake(wordKey(word), !wasRight);
        for (const other of buttons) {
          other.disabled = true;
          if (other.textContent === word.ru) other.classList.add("right");
        }
        if (!wasRight) button.classList.add("wrong");
        const feedback = document.getElementById("feedback");
        feedback.className = "feedback " + (wasRight ? "ok" : "bad");
        feedback.innerHTML = `<div class="full">${escapeHtml(word.ex)}${sayButton(word.ex)}</div>${word.note ? `<div class="note">${escapeHtml(word.note)}</div>` : ""}`;
        const nextButton = document.getElementById("next");
        nextButton.style.display = "";
        nextButton.focus();
      };
      buttons.push(button);
      box.appendChild(button);
    }
    document.getElementById("next").onclick = () => { index++; show(); };
  }
  show();
}

function startCloze() {
  const items = shuffle(pool("cloze"));
  if (!items.length) return emptyMistakes();
  let index = 0;
  let right = 0;

  function show() {
    if (index >= items.length) return renderDone(right, items.length, startCloze);
    const item = items[index];
    app.innerHTML = `<div class="card">
      <div class="progress"><span>${index + 1} / ${items.length}</span><span>верно: ${right}</span></div>
      <div class="hint">${escapeHtml(item.ru)}</div>
      <div class="prompt">${escapeHtml(item.q)}</div>
      <input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="пропущенное слово">
      <div class="row">
        <button class="primary" id="check">Проверить</button>
        <button id="skip">Не знаю</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>`;
    const input = document.getElementById("answer");
    const feedback = document.getElementById("feedback");
    let answered = false;
    input.focus();

    function finish(wasRight) {
      answered = true;
      if (wasRight) right++;
      markMistake(clozeKey(item), !wasRight);
      const full = item.q.replace("___", item.a[0]);
      feedback.className = "feedback " + (wasRight ? "ok" : "bad");
      feedback.innerHTML = `<div>${wasRight ? "Верно" : "Правильно:"} <b>${escapeHtml(item.a.join(" / "))}</b></div>
        <div class="full">${escapeHtml(full)}${sayButton(full)}</div>
        ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ""}`;
      const checkButton = document.getElementById("check");
      checkButton.textContent = "Дальше";
      document.getElementById("skip").disabled = true;
      checkButton.focus();
    }

    document.getElementById("check").onclick = () => {
      if (answered) { index++; show(); return; }
      finish(isCorrect(input.value, item.a));
    };
    document.getElementById("skip").onclick = () => finish(false);
    input.onkeydown = event => { if (event.key === "Enter") document.getElementById("check").click(); };
  }
  show();
}

function startCards() {
  const items = shuffle(pool("words"));
  if (!items.length) return emptyMistakes();
  let index = 0;
  let showEnglishFirst = false;

  function show() {
    const word = items[index];
    let flipped = false;
    app.innerHTML = `<div class="card flip" id="flip"></div>
      <div class="actions">
        <button id="prev">Назад</button>
        <button class="primary" id="next">Дальше</button>
        <button id="dir">${showEnglishFirst ? "Сначала EN" : "Сначала RU"}</button>
        <span class="hint">${index + 1} / ${items.length}</span>
      </div>`;
    const flip = document.getElementById("flip");
    function paint() {
      const frontRu = !showEnglishFirst;
      const showRu = flipped ? !frontRu : frontRu;
      flip.innerHTML = showRu
        ? `<div class="side">${flipped ? "ответ" : "нажмите, чтобы перевернуть"}</div><div class="big">${escapeHtml(word.ru)}</div>`
        : `<div class="side">${flipped ? "ответ" : "нажмите, чтобы перевернуть"}</div><div class="big">${escapeHtml(word.en.join(" / "))}</div>${trLine(word)}<div class="ex">${escapeHtml(word.ex)}</div>${word.note && flipped ? `<div class="note">${escapeHtml(word.note)}</div>` : ""}`;
    }
    flip.onclick = () => { flipped = !flipped; paint(); };
    document.getElementById("prev").onclick = () => { index = (index - 1 + items.length) % items.length; show(); };
    document.getElementById("next").onclick = () => { index = (index + 1) % items.length; show(); };
    document.getElementById("dir").onclick = () => { showEnglishFirst = !showEnglishFirst; show(); };
    paint();
  }
  show();
}

function startList() {
  const lesson = currentLesson();
  const rows = lesson.words.map(word => `<tr>
    <td class="en"><span>${escapeHtml(word.en.join(" / "))}</span>${mistakes[wordKey(word)] ? ' <span class="badge">ошибка</span>' : ""}${trLine(word)}</td>
    <td>${escapeHtml(word.ru)}<div class="hint">${escapeHtml(word.ex)}</div>${word.note ? `<div class="n">${escapeHtml(word.note)}</div>` : ""}</td>
  </tr>`).join("");
  app.innerHTML = `<div class="actions" style="margin-top:0;margin-bottom:10px">
      <button id="toggleEn">Скрыть английский</button>
      <button id="reset">Сбросить ошибки урока</button>
    </div>
    <div class="card" style="padding:8px 12px">
      <table id="table"><thead><tr><th>English</th><th>Русский, пример, пояснение</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  const table = document.getElementById("table");
  document.getElementById("toggleEn").onclick = event => {
    table.classList.toggle("hidden-en");
    event.target.textContent = table.classList.contains("hidden-en") ? "Показать английский" : "Скрыть английский";
  };
  table.onclick = event => {
    const cell = event.target.closest("td.en");
    if (cell && table.classList.contains("hidden-en")) cell.classList.add("shown");
  };
  document.getElementById("reset").onclick = () => {
    for (const key of Object.keys(mistakes)) if (key.startsWith(lessonId + "|")) delete mistakes[key];
    saveMistakes(mistakes);
    updateMistakeCount();
    startList();
  };
}


function stripTo(text) { return text.replace(/^to /, ""); }

function startPairs() {
  const items = shuffle(pool("words"));
  if (!items.length) return emptyMistakes();
  const ROUND = 6;
  let start = 0;
  let firstTry = 0;
  let total = 0;
  const startedAt = Date.now();

  function round() {
    const batch = items.slice(start, start + ROUND);
    if (!batch.length) {
      const seconds = Math.round((Date.now() - startedAt) / 1000);
      return renderDone(firstTry, total, startPairs, `Время: ${seconds} с. Засчитаны пары, найденные с первой попытки.`);
    }
    const left = shuffle(batch);
    const right = shuffle(batch);
    const missed = new Set();
    let selected = null;
    let found = 0;
    app.innerHTML = `<div class="card">
      <div class="progress"><span>Пары: ${Math.min(start + ROUND, items.length)} / ${items.length}</span><span>с первой попытки: ${firstTry}</span></div>
      <div class="hint">Нажмите слово слева, потом его перевод справа</div>
      <div class="pairs"><div class="col" id="colEn"></div><div class="col" id="colRu"></div></div>
    </div>`;
    const colEn = document.getElementById("colEn");
    const colRu = document.getElementById("colRu");
    for (const word of left) {
      const tile = document.createElement("button");
      tile.className = "tile";
      tile.textContent = word.en[0];
      tile.onclick = () => {
        if (tile.disabled) return;
        if (selected) selected.tile.classList.remove("sel");
        selected = { tile, word };
        tile.classList.add("sel");
        speak(stripTo(word.en[0]));
      };
      colEn.appendChild(tile);
    }
    for (const word of right) {
      const tile = document.createElement("button");
      tile.className = "tile";
      tile.textContent = word.ru;
      tile.onclick = () => {
        if (!selected || tile.disabled) return;
        if (selected.word.ru === word.ru) {
          for (const done of [selected.tile, tile]) { done.classList.remove("sel"); done.classList.add("right"); done.disabled = true; }
          total++;
          if (!missed.has(word)) { firstTry++; markMistake(wordKey(word), false); }
          selected = null;
          found++;
          if (found === batch.length) setTimeout(() => { start += ROUND; round(); }, 500);
        } else {
          missed.add(selected.word);
          markMistake(wordKey(selected.word), true);
          tile.classList.add("wrong");
          setTimeout(() => tile.classList.remove("wrong"), 450);
        }
      };
      colRu.appendChild(tile);
    }
  }
  round();
}

function startScramble() {
  const items = shuffle(pool("words").filter(word => stripTo(word.en[0]).length <= 22));
  if (!items.length) return emptyMistakes();
  let index = 0;
  let right = 0;

  function show() {
    if (index >= items.length) return renderDone(right, items.length, startScramble);
    const word = items[index];
    const target = stripTo(word.en[0]);
    const letters = shuffle([...target].map((ch, position) => ({ ch, position })).filter(item => item.ch !== " "));
    const typed = [];
    let usedHint = false;
    let answered = false;
    app.innerHTML = `<div class="card">
      <div class="progress"><span>${index + 1} / ${items.length}</span><span>верно: ${right}</span></div>
      <div class="hint">Соберите слово из букв</div>
      <div class="prompt">${escapeHtml(word.ru)}</div>
      <div class="slots" id="slots"></div>
      <div class="letters" id="letters"></div>
      <div class="row">
        <button id="erase">Стереть</button>
        <button id="hintBtn">Подсказать букву</button>
        <button id="skip">Не знаю</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions"><button class="primary" id="next" style="display:none">Дальше</button></div>
    </div>`;
    const slots = document.getElementById("slots");
    const lettersBox = document.getElementById("letters");
    const letterButtons = [];

    function paint() {
      let html = "";
      let typedIndex = 0;
      for (const ch of target) {
        if (ch === " ") { html += '<span class="gap"></span>'; continue; }
        const item = typed[typedIndex++];
        html += `<span class="slot">${item ? escapeHtml(item.button.textContent) : ""}</span>`;
      }
      slots.innerHTML = html;
    }
    function finish(wasRight) {
      answered = true;
      if (wasRight) right++;
      markMistake(wordKey(word), !wasRight);
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback " + (wasRight ? "ok" : "bad");
      const label = wasRight ? "Верно" : (usedHint && typed.length === letters.length ? "Собрано с подсказкой, слово попадёт в ошибки:" : "Правильно:");
      feedback.innerHTML = `<div>${label} <b>${escapeHtml(target)}</b></div>${trLine(word)}<div class="full">${escapeHtml(word.ex)}</div>`;
      for (const button of letterButtons) button.disabled = true;
      for (const id of ["erase", "hintBtn", "skip"]) document.getElementById(id).disabled = true;
      const next = document.getElementById("next");
      next.style.display = "";
      next.focus();
    }
    function check() {
      const built = typed.map(item => item.button.textContent).join("");
      if (built.length < letters.length) return;
      const expected = target.replace(/ /g, "");
      if (built.toLowerCase() === expected.toLowerCase()) finish(!usedHint);
      else slots.classList.add("shake"), setTimeout(() => slots.classList.remove("shake"), 400);
    }
    for (const item of letters) {
      const button = document.createElement("button");
      button.className = "letter";
      button.textContent = item.ch;
      button.onclick = () => {
        if (answered || button.disabled) return;
        button.disabled = true;
        typed.push({ button });
        paint();
        check();
      };
      letterButtons.push(button);
      lettersBox.appendChild(button);
    }
    document.getElementById("erase").onclick = () => {
      const last = typed.pop();
      if (last) last.button.disabled = false;
      paint();
    };
    document.getElementById("hintBtn").onclick = () => {
      usedHint = true;
      const expected = target.replace(/ /g, "");
      while (typed.length && typed.map(item => item.button.textContent).join("") !== expected.slice(0, typed.length)) {
        typed.pop().button.disabled = false;
      }
      const need = expected[typed.length];
      const button = letterButtons.find(candidate => !candidate.disabled && candidate.textContent === need);
      if (button) button.click();
      else paint();
    };
    document.getElementById("skip").onclick = () => finish(false);
    document.getElementById("next").onclick = () => { index++; show(); };
    paint();
  }
  show();
}

function startBlitz() {
  const items = pool("words");
  const allWords = currentLesson().words;
  if (!items.length) return emptyMistakes();
  if (allWords.length < 2) return emptyMistakes();
  const SECONDS = 60;
  const bestKey = "english-practice-blitz-" + lessonId;
  let best = 0;
  try { best = Number(localStorage.getItem(bestKey)) || 0; } catch (e) {}

  app.innerHTML = `<div class="card done">
    <div class="hint">Блиц: ${SECONDS} секунд</div>
    <p>Показывается слово и перевод. Решите быстро: перевод верный или нет.<br>Клавиши: ← неверно, → верно.</p>
    <div class="hint">Рекорд в этом уроке: ${best}</div>
    <div class="actions" style="justify-content:center"><button class="primary" id="go">Старт</button></div>
  </div>`;
  document.getElementById("go").onclick = run;

  function run() {
    let score = 0;
    let wrong = 0;
    let left = SECONDS;
    let current = null;
    app.innerHTML = `<div class="card">
      <div class="progress"><span id="timer">${left} с</span><span id="score">очки: 0</span></div>
      <div class="prompt" id="bEn" style="text-align:center"></div>
      <div class="blitz-ru" id="bRu"></div>
      <div class="blitz-buttons">
        <button id="no">Неверно</button>
        <button id="yes" class="primary">Верно</button>
      </div>
      <div class="hint" id="last" style="text-align:center;min-height:24px;margin-top:10px"></div>
    </div>`;
    function next() {
      const word = items[Math.floor(Math.random() * items.length)];
      const isTrue = Math.random() < 0.5;
      let shown = word;
      if (!isTrue) {
        const others = allWords.filter(other => other.ru !== word.ru);
        shown = others[Math.floor(Math.random() * others.length)];
      }
      current = { word, isTrue: shown.ru === word.ru };
      document.getElementById("bEn").textContent = word.en[0];
      document.getElementById("bRu").textContent = shown.ru;
    }
    function answer(saidTrue) {
      if (!current) return;
      const last = document.getElementById("last");
      if (saidTrue === current.isTrue) {
        score++;
        last.textContent = "";
      } else {
        wrong++;
        markMistake(wordKey(current.word), true);
        last.textContent = `${current.word.en[0]} — ${current.word.ru}`;
      }
      document.getElementById("score").textContent = "очки: " + score;
      next();
    }
    function onKey(event) {
      if (event.key === "ArrowRight") answer(true);
      if (event.key === "ArrowLeft") answer(false);
    }
    document.getElementById("yes").onclick = () => answer(true);
    document.getElementById("no").onclick = () => answer(false);
    document.addEventListener("keydown", onKey);
    const timer = setInterval(() => {
      left--;
      const timerBox = document.getElementById("timer");
      if (!timerBox) { clearInterval(timer); document.removeEventListener("keydown", onKey); return; }
      timerBox.textContent = left + " с";
      if (left <= 0) {
        clearInterval(timer);
        document.removeEventListener("keydown", onKey);
        current = null;
        const isRecord = score > best;
        if (isRecord) { try { localStorage.setItem(bestKey, String(score)); } catch (e) {} }
        renderDone(score, score + wrong, startBlitz, isRecord ? "Новый рекорд!" : `Рекорд: ${best}`);
      }
    }, 1000);
    next();
  }
}

function startListen() {
  if (!("speechSynthesis" in window) && !Object.keys(AUDIO).length) {
    app.innerHTML = '<div class="card done"><p>Этот браузер не умеет произносить текст. Откройте страницу в Safari или Chrome.</p></div>';
    return;
  }
  const items = shuffle(pool("words"));
  if (!items.length) return emptyMistakes();
  let index = 0;
  let right = 0;

  function show() {
    if (index >= items.length) return renderDone(right, items.length, startListen);
    const word = items[index];
    const spoken = stripTo(word.en[0]);
    app.innerHTML = `<div class="card">
      <div class="progress"><span>${index + 1} / ${items.length}</span><span>верно: ${right}</span></div>
      <div class="hint">Послушайте и напишите по-английски</div>
      <div class="row" style="margin:10px 0 14px">
        <button class="primary" id="play">Слушать</button>
        <button id="slow">Медленно</button>
      </div>
      <input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="что вы услышали">
      <div class="row">
        <button class="primary" id="check">Проверить</button>
        <button id="skip">Не знаю</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>`;
    const input = document.getElementById("answer");
    let answered = false;
    function say(rate) {
      const file = AUDIO[spoken];
      if (file) {
        if (currentAudio) currentAudio.pause();
        currentAudio = new Audio("audio/" + file);
        currentAudio.playbackRate = rate < 0.8 ? 0.7 : 1;
        currentAudio.play().catch(() => {});
        return;
      }
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spoken);
      utterance.lang = "en-GB";
      utterance.rate = rate;
      if (sayVoices.voice) utterance.voice = sayVoices.voice;
      speechSynthesis.speak(utterance);
    }
    function finish(wasRight) {
      answered = true;
      if (wasRight) right++;
      markMistake(wordKey(word), !wasRight);
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback " + (wasRight ? "ok" : "bad");
      feedback.innerHTML = `<div>${wasRight ? "Верно" : "Правильно:"} <b>${escapeHtml(word.en.join(" / "))}</b> — ${escapeHtml(word.ru)}</div>${trLine(word)}${word.note ? `<div class="note">${escapeHtml(word.note)}</div>` : ""}`;
      document.getElementById("check").textContent = "Дальше";
      document.getElementById("skip").disabled = true;
      document.getElementById("check").focus();
    }
    document.getElementById("play").onclick = () => { say(0.9); input.focus(); };
    document.getElementById("slow").onclick = () => { say(0.55); input.focus(); };
    document.getElementById("check").onclick = () => {
      if (answered) { index++; show(); return; }
      finish(isCorrect(input.value, word.en));
    };
    document.getElementById("skip").onclick = () => finish(false);
    input.onkeydown = event => { if (event.key === "Enter") document.getElementById("check").click(); };
    setTimeout(() => say(0.9), 200);
    input.focus();
  }
  show();
}

const MODES = { type: startType, choice: startChoice, cloze: startCloze, cards: startCards, list: startList, pairs: startPairs, scramble: startScramble, blitz: startBlitz, listen: startListen };

function render() { MODES[mode](); }

document.getElementById("tabs").onclick = event => {
  const button = event.target.closest("button");
  if (!button) return;
  mode = button.dataset.mode;
  for (const tab of document.querySelectorAll("#tabs button")) tab.classList.toggle("active", tab === button);
  render();
};
lessonSelect.onchange = () => {
  lessonId = lessonSelect.value;
  try { localStorage.setItem(LESSON_KEY, lessonId); } catch (e) {}
  updateMistakeCount();
  render();
};
onlyMistakesBox.onchange = render;

updateMistakeCount();
render();

if (tg && tg.CloudStorage) {
  try {
    tg.CloudStorage.getItem(STORE_KEY, (error, value) => {
      if (error || !value) return;
      try {
        const cloud = JSON.parse(value);
        for (const key of Object.keys(cloud)) mistakes[key] = Math.max(mistakes[key] || 0, cloud[key]);
        try { localStorage.setItem(STORE_KEY, JSON.stringify(mistakes)); } catch (e) {}
        updateMistakeCount();
      } catch (e) {}
    });
  } catch (e) {}
}
